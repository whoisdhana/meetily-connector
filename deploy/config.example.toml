# meetily-connector configuration
# Install to ~/.meetily-connector/config.toml (chmod 600).
# Every key can be overridden with MEETILY_CONNECTOR_<FIELD>=... env vars.
# Secrets NEVER go in this file — point at where they live instead.

[meetily]
# Empty = auto-discover from known Meetily install locations.
db_path = ""

[watch]
# When to fire:
#   "summary"    - after Meetily's own summary generation completes (requires
#                  running Meetily's summary model per meeting)
#   "transcript" - as soon as the recording stops and the transcript is saved;
#                  Meetily's summary engine is never needed
trigger = "summary"
poll_interval_seconds = 30
# Meetings shorter than this are skipped (accidental recordings).
min_duration_seconds = 60
# Where meeting.completed payloads are POSTed. Required for watch mode.
# https:// always allowed; plain http:// only to 127.0.0.1/localhost.
webhook_url = "http://127.0.0.1:8644/webhooks/meetily-meeting"
# Set true ONLY if you understand you'd be sending transcripts in cleartext.
allow_insecure_transport = false
max_payload_bytes = 1000000
# Optional hint passed through to the receiver (e.g. "ta-en-mixed").
language_hint = ""

# HMAC signing secret for the webhook. Pick ONE source:
#   env      — read from the env var named by secret_env
#   keychain — macOS: security find-generic-password -s <service> -w
#   file     — a file that must be chmod 600
secret_source = "env"
secret_env = "MEETILY_WEBHOOK_SECRET"
secret_keychain_service = "meetily-webhook"
secret_keychain_account = ""
secret_file = ""

[transcribe]
# "meetily" = use Meetily's local transcript as-is.
# "gemini"  = re-transcribe the recording with Google Gemini Transcribe
#             (better for non-English / code-mixed speech; needs an API key
#             from https://aistudio.google.com/apikey). Falls back to the
#             local transcript if the API call fails. The uploaded audio is
#             deleted from Google's file storage after transcription.
transcriber = "meetily"
gemini_model = "gemini-3.5-transcribe"
# [] = auto-detect (handles mid-session code-mixing). Or e.g. ["ta-IN", "en-IN"].
gemini_language_codes = []
# Speaker labels (spk_1/spk_2...) — auto-disabled for recordings over 30 min.
gemini_diarization = true
# Domain terms to bias recognition, e.g. product names.
gemini_custom_vocabulary = []
# API key source, same scheme as the webhook secret:
gemini_key_source = "env"        # env | keychain | file
gemini_key_env = "GEMINI_API_KEY"
gemini_key_keychain_service = "gemini-api-key"
gemini_key_keychain_account = ""
gemini_key_file = ""

[notes]
# Local markdown archive: one file per meeting with an LLM summary, action
# items, and the full transcript. Uses the same Gemini key as [transcribe].
enabled = false
dir = "~/Documents/MeetingNotes"
summary_model = "gemini-3.5-flash-lite"
language = "en"

[retry]
base_seconds = 30
max_seconds = 3600
# 0 = retry transient failures forever (e.g. receiver offline).
max_attempts = 0
